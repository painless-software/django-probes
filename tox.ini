[tox]
envlist =
    lint
    format
    audit
    # Python/Django combinations that are officially supported (minus end-of-life Pythons)
    py{310,311,312,313,314}-django{52}
    py{312,313,314}-django{60}
    package
    clean

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60

[testenv]
description = Unit tests
deps =
    coverage[toml]
    pytest-django
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
commands =
    coverage run -m pytest {posargs}
    coverage report

[testenv:audit]
description = Scan for vulnerable dependencies
skip_install = true
deps =
    pip-audit
    uv
commands =
    uv export --no-emit-project --no-hashes -o requirements.txt -q
    pip-audit {posargs:-r requirements.txt --progress-spinner off}

[testenv:clean]
description = Remove Python bytecode and other debris
skip_install = true
deps = pyclean
commands = pyclean {posargs:. --debris --erase requirements.txt uv.lock tests/testproject.sqlite --yes --verbose}

[testenv:format]
description = Ensure consistent code style (Ruff)
skip_install = true
deps = ruff
commands = ruff format {posargs:--check --diff}

[testenv:lint]
description = Lightening-fast linting (Ruff)
skip_install = true
deps = ruff
commands = ruff check {posargs}

[testenv:mypy]
description = Perform static type checking
deps = mypy
commands = mypy {posargs:.}

[testenv:package]
description = Build package and check metadata (or upload package)
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine {posargs:check --strict} dist/*
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY_URL
